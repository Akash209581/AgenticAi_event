# Nginx Configuration for Agentic AI Day 2026 Web Application
# Server OS: Ubuntu 20.04 / 22.04 / 24.04 LTS
# Target Environment: 6,000+ University Students on Shared Wi-Fi NAT

server {
    listen 80;
    server_name your-domain.com www.your-domain.com; # Replace with server domain or public IP

    # Redirect HTTP to HTTPS (Enable after setting up Certbot SSL)
    # return 301 https://$host$request_uri;

    root /var/www/agentic-ai-day/frontend/dist;
    index index.html;

    # Gzip Compression Tuning
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Static Asset Caching (Vite Assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Frontend Single Page App (SPA) Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend Express API Reverse Proxy (/cseAI)
    location /cseAI {
        proxy_pass http://127.0.0.1:6007;
        proxy_http_version 1.1;

        # Upgrade headers for WebSockets / HTTP
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        # Forward Client Real IP & NAT Gateway Headers to Express
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy Timeouts for heavy concurrent traffic
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for low-latency JSON response streaming
        proxy_buffering off;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
