<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova — AI Mascot</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(120% 80% at 50% 0%, #1a2130 0%, #0b0e13 55%, #06080b 100%);
    color: #e9eef6;
    font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { position: fixed; inset: 0; width: 100%; height: 100%; }

  header {
    position: fixed; top: 28px; left: 32px; z-index: 3; pointer-events: none;
  }
  h1 {
    margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: #f4f8ff;
  }
  header p { margin: 6px 0 0; font-size: 13px; color: #8b97ab; max-width: 30ch; }

  #controls {
    position: fixed; left: 24px; bottom: 66px;
    z-index: 3; display: flex; flex-direction: column; gap: 8px;
    align-items: flex-start; width: min(calc(100vw - 48px), 760px);
  }
  .row {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-start;
    padding: 8px; border-radius: 16px; max-width: 100%;
    background: rgba(14, 19, 27, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.07);
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
  }
  .row::-webkit-scrollbar { display: none; }
  .chip { white-space: nowrap; flex: 0 0 auto; }
  .chip {
    appearance: none; border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03); color: #b8c4d6;
    border-radius: 9px; padding: 6px 10px; font: inherit; font-size: 11.5px;
    letter-spacing: 0.02em; cursor: pointer; transition: all 160ms ease;
  }
  .chip:hover { background: rgba(56,220,255,0.10); color: #dff6ff; border-color: rgba(56,220,255,0.3); }
  .chip.on {
    background: rgba(56,220,255,0.16); color: #eafaff;
    border-color: rgba(56,220,255,0.55);
    box-shadow: 0 0 0 1px rgba(56,220,255,0.18), 0 6px 20px rgba(56,220,255,0.15);
  }
  .label {
    align-self: center; font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: #5f6c80; padding: 0 8px 0 4px;
  }
  footer {
    position: fixed; left: 32px; bottom: 30px; z-index: 3;
    font-size: 12px; color: #55607142; text-align: left; pointer-events: none;
    display: none;
  }
  @media (max-width: 720px) {
    header { left: 18px; top: 18px; }
    footer { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Nova</h1>
  <p>Drag to orbit. Move your cursor — she follows. Click to greet, double-click to celebrate.</p>
</header>

<three-d-stage name="nova-mascot" background="transparent"></three-d-stage>

<div id="controls">
  <div class="row" id="expressions"><span class="label">Face</span></div>
  <div class="row" id="gestures"><span class="label">Gestures</span></div>
</div>

<footer>Procedural three.js · export OBJ / GLB above</footer>

<script src="./three-d-stage.js"></script>
<script type="module" src="./Main.js"></script>
</body>
</html>
